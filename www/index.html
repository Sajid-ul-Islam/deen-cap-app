<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DEEN Commerce</title>
  <style>
    :root {
      --brand-primary: #0A4D3C;
      --brand-primary-dark: #063328;
      --brand-accent: #D4AF37;
      --brand-accent-hover: #C59B27;
      --surface-bg: #FBF9F5;
      --surface-card: #FFFFFF;
      --text-primary: #1A202C;
      --text-secondary: #4A5568;
      --border-color: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--surface-bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    .container {
      background: var(--surface-card);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(10, 77, 60, 0.08);
      border: 1px solid var(--border-color);
    }

    .brand-logo {
      width: 72px;
      height: 72px;
      background: var(--brand-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 4px 12px rgba(10, 77, 60, 0.2);
    }

    .brand-logo svg {
      width: 40px;
      height: 40px;
      fill: var(--brand-accent);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--brand-primary);
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 13px;
      color: var(--brand-accent-hover);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .status-box {
      background: #F7FAFC;
      border: 1px solid #EDF2F7;
      border-radius: 12px;
      padding: 20px 16px;
      margin-bottom: 24px;
    }

    .status-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      color: #FFFFFF;
      background-color: var(--brand-primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .retry-btn:active {
      background-color: var(--brand-primary-dark);
      transform: scale(0.98);
    }

    .retry-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid #FFFFFF;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1>DEEN Commerce</h1>
    <div class="tagline">Modest Living, Ethical Commerce</div>

    <div class="status-box">
      <div class="status-icon" id="status-icon">📶</div>
      <p id="status-msg">Connecting to DEEN Commerce storefront...</p>
    </div>

    <button id="retry-btn" class="retry-btn" onclick="retryConnection()">
      <span class="spinner" id="spinner"></span>
      <span id="btn-text">Retry Connection</span>
    </button>
  </div>

  <script>
    const STORE_URL = 'https://deencommerce.com/';

    function updateStatus(isOnline) {
      const icon = document.getElementById('status-icon');
      const msg = document.getElementById('status-msg');
      if (isOnline) {
        icon.textContent = '🔄';
        msg.textContent = 'Connection detected. Loading store...';
        window.location.href = STORE_URL;
      } else {
        icon.textContent = '📡';
        msg.textContent = 'No Internet connection detected. Please verify your Wi-Fi or mobile data.';
      }
    }

    function retryConnection() {
      const btn = document.getElementById('retry-btn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btn-text');

      btn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Connecting...';

      if (navigator.onLine) {
        window.location.href = STORE_URL;
      } else {
        setTimeout(() => {
          btn.disabled = false;
          spinner.style.display = 'none';
          btnText.textContent = 'Retry Connection';
          updateStatus(false);
        }, 1500);
      }
    }

    window.addEventListener('online', () => updateStatus(true));
    window.addEventListener('offline', () => updateStatus(false));

    // Initial check
    if (navigator.onLine) {
      window.location.href = STORE_URL;
    } else {
      updateStatus(false);
    }
  </script>
</body>
</html>
